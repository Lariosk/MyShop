<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda de Ropa Online</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f6f0ff 45%, #f9fafb 100%);
            color: #1f2937;
        }

        .contenedor {
            width: 90%;
            max-width: 520px;
            margin: 30px auto;
        }

        .tarjeta {
            background: rgba(255, 255, 255, 0.92);
            padding: 30px 28px 26px;
            border-radius: 28px;
            box-shadow: 0 20px 45px rgba(31, 41, 55, 0.12);
            border: 1px solid rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(8px);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 22px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            color: #4338ca;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #111827;
            font-size: clamp(2rem, 4vw, 2.5rem);
            line-height: 1.2;
        }

        .descripcion {
            text-align: center;
            color: #64748b;
            margin: 10px 0 26px;
            font-size: 1rem;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #334155;
        }

        .campo {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d7e1ee;
            border-radius: 14px;
            font-size: 1rem;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #7c3aed;
            background: white;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }

        button {
            width: 100%;
            padding: 15px 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 26px rgba(59, 130, 246, 0.28);
        }

        .error {
            color: #b91c1c;
            background: linear-gradient(135deg, #fee2e2, #fff1f2);
            border: 1px solid #fca5a5;
            padding: 12px 14px;
            border-radius: 12px;
            margin-top: 16px;
            display: none;
            font-weight: 600;
        }

        .resultado {
            margin-top: 22px;
            padding: 20px 18px;
            background: linear-gradient(135deg, #eff6ff, #f5f3ff);
            border: 1px solid rgba(96, 165, 250, 0.18);
            border-left: 5px solid #4f46e5;
            border-radius: 16px;
            display: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .resultado p {
            margin: 10px 0;
            color: #475569;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .resultado strong {
            color: #0f172a;
        }

        .descuento {
            font-size: 1.2rem;
            font-weight: 800;
            color: #2563eb;
        }

        .total {
            font-size: 1.45rem;
            font-weight: 800;
            color: #111827;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="tarjeta">

            <div class="encabezado">
                <h1>Tienda de Ropa</h1>
                <p class="descripcion">
                    Calculadora de descuentos
                </p>
            </div>

            <form id="formulario">

                <div class="campo">
                    <label for="compra">
                        Importe de la compra:
                    </label>

                    <input
                        type="number"
                        id="compra"
                        min="0"
                        step="0.01"
                        placeholder="Ejemplo: 5000"
                    >
                </div>

                <button type="submit">
                    Calcular descuento
                </button>

            </form>

            <div id="error" class="error"></div>

            <div id="resultado" class="resultado">

                <p>
                    Importe de compra:
                    <strong id="importe"></strong>
                </p>

                <p>
                    Porcentaje de descuento:
                    <strong id="porcentaje"></strong>
                </p>

                <p>
                    Descuento:
                    <strong id="descuento" class="descuento"></strong>
                </p>

                <p>
                    Total a pagar:
                    <strong id="total" class="total"></strong>
                </p>

            </div>

        </div>

    </div>


    <script>

        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const compra = parseFloat(
                document.getElementById("compra").value
            );

            const error = document.getElementById("error");
            const resultado = document.getElementById("resultado");

            // Limpiar mensajes anteriores
            error.style.display = "none";
            resultado.style.display = "none";

            // Validación
            if (isNaN(compra)) {

                error.textContent =
                    "Error: debe ingresar el importe de la compra.";

                error.style.display = "block";

                return;
            }

            if (compra <= 0) {

                error.textContent =
                    "Error: el importe de la compra debe ser mayor que $0.";

                error.style.display = "block";

                return;
            }

            // Determinar descuento
            let porcentaje = 0;

            if (compra > 10000) {

                porcentaje = 15;

            } else if (compra >= 5000) {

                porcentaje = 10;

            } else if (compra >= 1000) {

                porcentaje = 5;

            }

            // Calcular descuento
            const descuento = compra * (porcentaje / 100);

            // Calcular total
            const total = compra - descuento;

            // Mostrar resultados
            document.getElementById("importe").textContent =
                "$" + compra.toFixed(2);

            document.getElementById("porcentaje").textContent =
                porcentaje + "%";

            document.getElementById("descuento").textContent =
                "$" + descuento.toFixed(2);

            document.getElementById("total").textContent =
                "$" + total.toFixed(2);

            resultado.style.display = "block";

        });

    </script>

</body>
</html>
